version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 7804877524
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  rabbitmq-broker:
    image: rabbitmq:3-management
    container_name: rabbitmq-broker
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      timeout: 5s
      retries: 10

  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq-broker
    depends_on:
      - discovery-service

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/auth_db?createDatabaseIfNotExist=true
      - SPRING_RABBITMQ_HOST=rabbitmq-broker
    depends_on:
      mysql-db:
        condition: service_healthy
      discovery-service:
        condition: service_started

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8082:8082"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/user_db?createDatabaseIfNotExist=true
      - SPRING_RABBITMQ_HOST=rabbitmq-broker
    depends_on:
      mysql-db:
        condition: service_healthy
      discovery-service:
        condition: service_started

  document-service:
    build: ./document-service
    container_name: document-service
    ports:
      - "8083:8083"
    volumes:
      - C:/microservices-project/uploads:/app/uploads
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/document_db?createDatabaseIfNotExist=true
      - SPRING_RABBITMQ_HOST=rabbitmq-broker
      - FILE_UPLOAD_DIR=/app/uploads
    depends_on:
      mysql-db:
        condition: service_healthy
      discovery-service:
        condition: service_started

  worker-service:
    build: ./worker-service
    container_name: worker-service
    ports:
      - "8084:8084"
    volumes:
      - C:/microservices-project/uploads:/app/uploads
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq-broker
      - FILE_UPLOAD_DIR=/app/uploads
    depends_on:
      discovery-service:
        condition: service_healthy
      rabbitmq-broker:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8085:8085"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq-broker
    depends_on:
      discovery-service:
        condition: service_healthy
      rabbitmq-broker:
        condition: service_healthy
