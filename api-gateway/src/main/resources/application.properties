spring.application.name=api-gateway
server.port=8080

# Eureka Client Configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Spring Cloud Gateway Routing Configuration
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[1].filters[0]=JwtAuthenticationFilter

spring.cloud.gateway.routes[2].id=document-service
spring.cloud.gateway.routes[2].uri=lb://document-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/documents/**
spring.cloud.gateway.routes[2].filters[0]=JwtAuthenticationFilter

spring.cloud.gateway.routes[3].id=notification-service
spring.cloud.gateway.routes[3].uri=lb://notification-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[3].filters[0]=JwtAuthenticationFilter

spring.cloud.gateway.routes[4].id=worker-service
spring.cloud.gateway.routes[4].uri=lb://worker-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/workers/**
spring.cloud.gateway.routes[4].filters[0]=JwtAuthenticationFilter

# Swagger API Docs Routes
spring.cloud.gateway.routes[5].id=auth-service-docs
spring.cloud.gateway.routes[5].uri=lb://auth-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/auth/v3/api-docs
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/auth/(?<segment>.*), /$\\{segment}

spring.cloud.gateway.routes[6].id=user-service-docs
spring.cloud.gateway.routes[6].uri=lb://user-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/user/v3/api-docs
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/user/(?<segment>.*), /$\\{segment}

spring.cloud.gateway.routes[7].id=document-service-docs
spring.cloud.gateway.routes[7].uri=lb://document-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/document/v3/api-docs
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/document/(?<segment>.*), /$\\{segment}

spring.cloud.gateway.routes[8].id=notification-service-docs
spring.cloud.gateway.routes[8].uri=lb://notification-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/notification/v3/api-docs
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/notification/(?<segment>.*), /$\\{segment}

spring.cloud.gateway.routes[9].id=worker-service-docs
spring.cloud.gateway.routes[9].uri=lb://worker-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/worker/v3/api-docs
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/worker/(?<segment>.*), /$\\{segment}
# Global CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# Swagger / OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[0].url=/auth/v3/api-docs
springdoc.swagger-ui.urls[1].name=user-service
springdoc.swagger-ui.urls[1].url=/user/v3/api-docs
springdoc.swagger-ui.urls[2].name=document-service
springdoc.swagger-ui.urls[2].url=/document/v3/api-docs
springdoc.swagger-ui.urls[3].name=notification-service
springdoc.swagger-ui.urls[3].url=/notification/v3/api-docs
springdoc.swagger-ui.urls[4].name=worker-service
springdoc.swagger-ui.urls[4].url=/worker/v3/api-docs

# Logging Configuration
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.example.gateway=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# JWT Configuration (Custom properties)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# RabbitMQ Configuration
spring.rabbitmq.host=host.docker.internal
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
